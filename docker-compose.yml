services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: student_system
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRoot@123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./studentsystem
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
    ports:
      - "9090:9090"

  frontend:
    build:
      context: ./Student-System-Frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:9090
    ports:
      - "5173:5173"

volumes:
  mysql-data:
